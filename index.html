<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORMYLA Meet — видеовстречи, доска и совместная работа</title>
<meta name="description" content="FORMYLA Meet — видеовстречи в стиле FORMYLA.net: HD-видео, чат, демонстрация экрана, интерактивная доска, сессионные залы, опросы, записи и субтитры.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2338ef7d'/%3E%3Cstop offset='1' stop-color='%2311998e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Cpolygon points='50,20 75,35 75,65 50,80 25,65 25,35' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Cpolyline points='35,42 50,50 50,80' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Cline x1='50' y1='50' x2='65' y2='42' stroke='url(%23g)' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ===== Раздел «Видеовстречи» (без собственной шапки — используется шапка FORMYLA.net) ===== -->
<div id="fm">
<div class="fm-bar">
  <nav class="fm-tabs" id="navLinks" aria-label="Разделы видеовстреч">
    <a href="#/home" class="fm-tab" data-route="home">🏠 Главная</a>
    <a href="#/meetings" class="fm-tab" data-route="meetings">📅 Встречи</a>
    <a href="#/recordings" class="fm-tab" data-route="recordings">🎥 Записи</a>
    <a href="#/contacts" class="fm-tab" data-route="contacts">👥 Контакты</a>
    <a href="#/whiteboard" class="fm-tab" data-route="whiteboard">🧑‍🏫 Доска</a>
    <a href="#/settings" class="fm-tab" data-route="settings">⚙️ Настройки</a>
  </nav>
  <button class="btn-gradient btn-sm" id="headerNewMeeting">＋ Новая встреча</button>
</div>

<!-- ===== Основной контент (маршруты) ===== -->
<main class="main" id="app"></main>

<!-- ===== Комната встречи (полноэкранный слой) ===== -->
<section class="meeting-layer hidden" id="meetingLayer" aria-live="polite"></section>

<!-- ===== Всплывающие уведомления ===== -->
<div class="toasts" id="toasts"></div>

<!-- ===== Модальные окна ===== -->
<div class="modal-root hidden" id="modalRoot"></div>
</div><!-- /#fm -->

<script src="./icons.js"></script>
<script src="./whiteboard.js"></script>
<script src="./sim.js"></script>
<script src="./meeting.js"></script>
<script src="./app.js"></script>
</body>
</html>
